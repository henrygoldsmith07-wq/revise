name: Revise staging sync and RLS

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: main
    secrets:
      REVISE_STAGING_SUPABASE_URL:
        required: true
      REVISE_STAGING_SUPABASE_ANON_KEY:
        required: true
      REVISE_STAGING_USER_A_EMAIL:
        required: true
      REVISE_STAGING_USER_A_PASSWORD:
        required: true
      REVISE_STAGING_USER_B_EMAIL:
        required: true
      REVISE_STAGING_USER_B_PASSWORD:
        required: true
      REVISE_STAGING_DATABASE_URL:
        required: true
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 2"

permissions:
  contents: read

jobs:
  staging-sync:
    name: revise-staging-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVISE_STAGING_DATABASE_URL: ${{ secrets.REVISE_STAGING_DATABASE_URL }}
      REVISE_STAGING_SUPABASE_URL: ${{ secrets.REVISE_STAGING_SUPABASE_URL }}
      REVISE_STAGING_SUPABASE_ANON_KEY: ${{ secrets.REVISE_STAGING_SUPABASE_ANON_KEY }}
      REVISE_STAGING_USER_A_EMAIL: ${{ secrets.REVISE_STAGING_USER_A_EMAIL }}
      REVISE_STAGING_USER_A_PASSWORD: ${{ secrets.REVISE_STAGING_USER_A_PASSWORD }}
      REVISE_STAGING_USER_B_EMAIL: ${{ secrets.REVISE_STAGING_USER_B_EMAIL }}
      REVISE_STAGING_USER_B_PASSWORD: ${{ secrets.REVISE_STAGING_USER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify staging schema and RLS
        run: npm run test:staging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revise-staging-diagnostics
          path: artifacts/staging-*.json
          if-no-files-found: error
