name: Revise

on:
  push:
    paths:
      - "**"
      - ".github/workflows/revise.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/revise.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run verify
      - name: Verify client performance budget
        run: npm run perf:budget
      - name: Verify required Playwright dependency
        run: npm ls @playwright/test
      - name: Playwright E2E (Chromium, hard fail)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --reporter=github,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revise-playwright-report
          path: |
            playwright-report
            e2e/__screenshots__
          if-no-files-found: ignore
      - run: du -sh .next 2>/dev/null || du -sh dist 2>/dev/null || du -sh build 2>/dev/null || echo "no build artifact to measure"
