name: Revise curriculum freshness

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: revise-curriculum-freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check specification ages
        run: npm run curriculum:freshness -- --fail-on-stale
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revise-curriculum-freshness
          path: artifacts/curriculum-freshness.json
          if-no-files-found: ignore
